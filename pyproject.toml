[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
 
[project]
name = "brain_mri"
version = "0.1.0"
description = "Preprocessing pipeline for BraTS 2024 brain MRI segmentation (engineering thesis)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "nibabel",
    "scikit-learn",
    "pyyaml",
]
 
[tool.setuptools.packages.find]
where = ["src"]
 